<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Payment react native webview solution by valenvivv</title>
</head>

<body>

    <script src="https://checkout.squadco.com/widget/squad.min.js"></script>
    <script>
        // Function to parse query parameters from URL
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                key: params.get('key'),
                email: params.get('email'),
                amount: params.get('amount'),
                transaction_ref: params.get('transactionRef'),
                currency_code: params.get('currencyCode'),
                Payment_channels: params.get('payment_channels'),
                customer_name: params.get('customerName'),
                callback_url: params.get('customerName'),
                metadata: params.get('metadata'),
                pass_charge: params.get('passCharge') === 'true'
            };
        }

        // Parse and store query parameters
        const queryParams = getQueryParams();

        // Populate form fields when page loads
        window.addEventListener('DOMContentLoaded', function () {
            SquadPay();
        });

        async function SquadPay() {
            console.log("SquadPay function called!");
            console.log("Query parameters:", queryParams);
            // alert(`${queryParams.key} ${queryParams.email} ${queryParams.amount}`);
            // alert(`Please show at alll`);

            // Validate required parameters
            if (!queryParams.key || !queryParams.email || !queryParams.amount || !queryParams.currency_code) {
                alert(`${!queryParams.key ? 'Missing key' : ''}, ${!queryParams.email ? 'Missing email' : ''}, ${!queryParams.amount ? 'Missing amount' : ''}, ${!queryParams.currency_code ? 'Missing currency code' : ''}`);

                window.ReactNativeWebView?.postMessage(JSON.stringify({
                    type: 'SQUAD_CLOSE',
                    data: `${!queryParams.key ? 'Missing key' : ''}, ${!queryParams.email ? 'Missing email' : ''}, ${!queryParams.amount ? 'Missing amount' : ''}, ${!queryParams.currency_code ? 'Missing currency code' : ''}`
                }));
                return;
            }

            const squadInstance = new squad({

                onClose: (data) => {
                    console.log("Widget closed", data);
                    window.ReactNativeWebView?.postMessage(JSON.stringify({
                        type: 'SQUAD_CLOSE',
                        data: data
                    }));
                },

                onLoad: () => {
                    console.log("Squad widget loaded successfully!");
                },

                onSuccess: (data) => {
                    console.log("Payment successful", data);
                    window.ReactNativeWebView?.postMessage(JSON.stringify({
                        type: 'SUCCESS_PAYMENT',
                        data: data
                    }));
                },

                key: queryParams.key,
                email: queryParams.email,
                amount: parseInt(queryParams.amount),
                currency_code: queryParams.currency_code || "NGN",
                transaction_ref: queryParams.transaction_ref,
                payment_channel: queryParams.Payment_channel,
                customer_name: queryParams.customer_name,
                metadata: queryParams.metadata,
                pass_charge: queryParams.pass_charge

            });

            squadInstance.setup();
            squadInstance.open();
            //  console.log("squadInstance.open() called successfully!");

        }

        // Notify React Native that the page has loaded
        // window.addEventListener('load', function () {
        //     window.ReactNativeWebView?.postMessage(JSON.stringify({
        //         type: 'PAGE_LOADED'
        //     }));
        // });
    </script>
</body>

</html>
